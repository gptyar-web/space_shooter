<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <title>Space Shooter | نبرد کهکشانی</title>
  <meta name="description" content="بازی اسپیس شوتر با ۲۰ فصل، ۲۰۰ مرحله، فروشگاه و خرید سکه از بله">
  <link rel="stylesheet" href="./style.css?v=6.0.0">
  <link rel="stylesheet" href="./theme-v5.css?v=6.0.0">
</head>
<body>
  <a class="skip-link" href="#app">رفتن به محتوای اصلی</a>
  <div class="nebula" aria-hidden="true"></div>
  <div class="shell">
    <header id="topbar">
      <a class="brand" href="#home" id="brand"><span class="brand-icon">✦</span><span>GALAXY <strong>COMMAND</strong><small>SPACE SHOOTER / مرکز فرماندهی</small></span></a>
      <div class="header-right">
        <span id="connection-state" class="connection-state" role="status">در حال اتصال…</span><span class="release-version" id="release-version" aria-label="نسخه کنونی برنامه">نسخه ۶.۰.۰</span>
        <div class="coinbox" id="coinbox" hidden><span>🪙</span><b id="coinbalance">۰</b><button class="plus" id="coinplus" aria-label="افزایش موجودی">+</button></div>
        <span id="player-name" class="player-name"></span>
        <button class="ghost small" id="logout-btn" hidden>خروج</button>
      </div>
    </header>
    <nav id="nav" class="nav" hidden aria-label="فهرست اصلی"></nav>
    <section id="notice-area"></section>
    <main id="app" tabindex="-1">
      <section class="loading"><div class="orbit"></div><h2>در حال آماده‌سازی کهکشان…</h2></section>
    </main>
    <footer>ساخته‌شده برای پروژه برنامه‌نویسی کامپیوتر | ارشیا مزدبران | دبیرستان شهید کلاهدوزان ۲ | ورژن: ۶.۰.۰</footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=6.0.0"></script>
  <script>
    (() => {
      const app = document.getElementById("app");
      const startupMessage = "در بارگذاری برنامه مشکلی پیش آمد. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.";
      function showStartupFailure() {
        if (!app?.querySelector(".loading h2")?.textContent?.includes("در حال آماده‌سازی کهکشان")) return;
        app.innerHTML = '<section class="surface" style="max-width:650px;margin:45px auto;text-align:center"><h2>⚠️ بارگذاری برنامه ناموفق بود</h2><p>' + startupMessage + '</p><button type="button" class="button" id="retry-startup">تلاش دوباره</button></section>';
        document.getElementById("retry-startup")?.addEventListener("click", () => location.reload());
      }
      document.querySelector('script[type="module"]')?.addEventListener("error", showStartupFailure, {once:true});
      setTimeout(showStartupFailure, 15000);
    })();
  </script>
</body>
</html>
