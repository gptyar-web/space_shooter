name: Space Shooter checks
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          node --check app.js
          node --check game.js
          node --check jalali-calendar.js
      - name: Package and test game and Pages
        run: |
          mkdir -p _site
          cp index.html ./*.js ./*.css _site/
          node scripts/stamp-version.mjs
          node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/space-shooter-api/index.ts
          deno check supabase/functions/space-shooter-bale/index.ts
